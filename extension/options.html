<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="Flow2API Companion">Flow2API Companion</title>
  <style>
    :root {
      --paper: #fdfbf9;
      --card: #fffdfa;
      --dew: #f7efe9;
      --ink: #171717;
      --cocoa: #2b1a07;
      --marker: #ff6f1e;
      --sienna: #ce500a;
      --muted: #8a7663;
      --line: #e2d8ca;
      --line-strong: #cdbfae;
      --radius: 12px;
      --pill: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 20px 56px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 22px;
    }
    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600; font-size: 22px; color: var(--cocoa);
    }
    .brand span { color: var(--muted); font-size: 15px; font-weight: 400; }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: rgba(0,0,0,.06) 0 2px 20px 0;
      padding: 20px 22px; margin-bottom: 16px;
    }
    h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); margin: 0 0 14px; font-weight: 600;
    }
    label.field { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 6px; font-weight: 500; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%; padding: 9px 12px; font-size: 14px; font-family: inherit;
      color: var(--ink); background: var(--paper);
      border: 1px solid var(--line-strong); border-radius: 8px;
    }
    input:focus { outline: none; border-color: var(--marker); box-shadow: 0 0 0 3px rgba(255,111,30,.16); }
    .row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink); }
    .row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--marker); }
    .inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .inline input[type="number"] { width: 84px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1;
      padding: 11px 22px; margin-top: 16px;
      border-radius: var(--pill); border: 1.5px solid var(--ink);
      background: var(--paper); color: var(--ink); cursor: pointer;
      box-shadow: rgba(0,0,0,.25) 0 1px 2px 0;
      transition: background-color .15s ease;
    }
    .btn:hover { background: var(--dew); }
    .btn:disabled { opacity: .55; cursor: progress; }
    .btn-primary { background: var(--marker); border-color: var(--marker); color: #fff8f2; }
    .btn-primary:hover { background: var(--sienna); border-color: var(--sienna); }
    .pill {
      font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: var(--pill);
      border: 1px solid var(--line-strong); background: var(--dew); color: var(--muted);
      white-space: nowrap;
    }
    .pill.on { background: #edf7ee; border-color: #bfe0c6; color: #266631; }
    .pill.off { background: #fdeee6; border-color: #f0c6b0; color: #a8450a; }
    .hint { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }
    .hint.err { color: var(--sienna); }
    .hint.ok { color: #2f7d3a; }
    .account {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; color: var(--cocoa); background: var(--dew);
      border: 1px dashed var(--line-strong); border-radius: 8px;
      padding: 9px 12px; margin: 0 0 14px; word-break: break-all;
    }
    details { margin-top: 4px; }
    summary {
      cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em; padding: 6px 0;
    }
    summary:hover { color: var(--ink); }
    .lang { font-size: 12px; border-radius: var(--pill); border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); padding: 5px 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Flow2API <span>Companion</span></div>
      <div class="inline">
        <select id="language" class="lang" data-language-select>
          <option value="pt-BR">Português</option>
          <option value="en">English</option>
          <option value="zh-CN">中文</option>
        </select>
        <span id="statusPill" class="pill">—</span>
      </div>
    </header>

    <section class="panel">
      <h2 data-i18n="Servidor">Servidor</h2>
      <label class="field" for="serverBase" data-i18n="Endereço do servidor">Endereço do servidor</label>
      <input id="serverBase" type="text" placeholder="http://127.0.0.1:8000" spellcheck="false">
      <label class="field" for="apiKey" data-i18n="API Key">API Key</label>
      <input id="apiKey" type="password" placeholder="" spellcheck="false">
      <button id="saveBtn" class="btn btn-primary" data-i18n="Salvar e conectar">Salvar e conectar</button>
      <p class="hint" data-i18n="A API Key fica no painel em Configurações. O endereço é o mesmo que você abre no navegador.">
        A API Key fica no painel em Configurações. O endereço é o mesmo que você abre no navegador.
      </p>
    </section>

    <section class="panel">
      <h2 data-i18n="Conta Google">Conta Google</h2>
      <p id="accountLine" class="account" data-i18n="Nenhuma sincronização ainda">Nenhuma sincronização ainda</p>
      <div class="row">
        <input type="checkbox" id="autoSync">
        <label for="autoSync" data-i18n="Renovar automaticamente">Renovar automaticamente</label>
      </div>
      <div class="inline" style="margin-top:12px;">
        <span style="font-size:13.5px;" data-i18n="a cada">a cada</span>
        <input id="autoSyncMinutes" type="number" min="5" max="1440" step="5">
        <span style="font-size:13.5px;" data-i18n="minutos">minutos</span>
      </div>
      <button id="syncBtn" class="btn" data-i18n="Sincronizar agora">Sincronizar agora</button>
      <p id="syncResult" class="hint"></p>
    </section>

    <details class="panel">
      <summary data-i18n="Avançado">Avançado</summary>
      <label class="field" for="routeKey" data-i18n="Route Key (deixe vazio na maioria dos casos)">
        Route Key (deixe vazio na maioria dos casos)
      </label>
      <input id="routeKey" type="text" spellcheck="false">
      <label class="field" for="clientLabel" data-i18n="Nome do cliente (opcional)">Nome do cliente (opcional)</label>
      <input id="clientLabel" type="text" spellcheck="false">
    </details>
  </div>
  <script src="options.js"></script>
</body>
</html>
